[defaults]
# Инвентори указывается явно: -i inventories/test или -i inventories/prod
roles_path             = roles
collections_path       = collections:~/.ansible/collections:/usr/share/ansible/collections
interpreter_python     = auto_silent
stdout_callback        = default
callback_result_format = yaml
retry_files_enabled    = False
forks                  = 20
gathering              = smart
fact_caching           = memory
# Секреты в vault: пароль передавайте через --ask-vault-pass или
# --vault-password-file, не храните его в репозитории.

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root

[ssh_connection]
# pipelining обязателен: часть задач выполняется через become_user postgres
# (pgbackrest, community.postgresql), а пакет acl на узлах не ставится.
pipelining = True
