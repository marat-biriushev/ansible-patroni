---
# cluster_node_ip (по умолчанию = ansible_host) — адрес, на котором сервисы
# слушают и которым узлы общаются между собой.
all:
  children:
    postgres:
      hosts:
        int-res-prod-psql01:
          ansible_host: 172.31.60.51
        int-res-prod-psql02:
          ansible_host: 172.31.60.52
        int-res-prod-psql03:
          ansible_host: 172.31.60.53
    # etcd совмещён с узлами БД (etcd_colocated: true в group_vars/all/main.yml)
    etcd:
      hosts:
        int-res-prod-psql01:
        int-res-prod-psql02:
        int-res-prod-psql03:
    haproxy:
      hosts:
        int-res-prod-ha01:
          ansible_host: 172.31.60.54
        int-res-prod-ha02:
          ansible_host: 172.31.60.55
