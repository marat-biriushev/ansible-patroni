---
# Пример инвентори. IP-адреса и имена замените на реальные.
# cluster_node_ip (по умолчанию = ansible_host) — адрес, на котором сервисы
# слушают и которым узлы общаются между собой.
all:
  children:
    etcd:
      hosts:
        etcd01:
          ansible_host: 10.10.10.11
        etcd02:
          ansible_host: 10.10.10.12
        etcd03:
          ansible_host: 10.10.10.13
      # Совмещение etcd с узлами БД: перечислите здесь pg01..pg03 вместо
      # etcd01..etcd03 и выставьте etcd_colocated: true в group_vars/all/main.yml.
    postgres:
      hosts:
        pg01:
          ansible_host: 10.10.10.21
        pg02:
          ansible_host: 10.10.10.22
        pg03:
          ansible_host: 10.10.10.23
    haproxy:
      hosts:
        haproxy01:
          ansible_host: 10.10.10.31
        haproxy02:
          ansible_host: 10.10.10.32
