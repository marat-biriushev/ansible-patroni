---
# Связка секретов из vault.yml с переменными ролей. Значения — только в vault.
patroni_superuser_password: "{{ vault_patroni_superuser_password | default('') }}"
patroni_replication_password: "{{ vault_patroni_replication_password | default('') }}"
patroni_rewind_password: "{{ vault_patroni_rewind_password | default('') }}"
patroni_restapi_password: "{{ vault_patroni_restapi_password | default('') }}"
etcd_root_password: "{{ vault_etcd_root_password | default('') }}"
etcd_patroni_password: "{{ vault_etcd_patroni_password | default('') }}"
keepalived_auth_pass: "{{ vault_keepalived_auth_pass | default('') }}"
haproxy_stats_password: "{{ vault_haproxy_stats_password | default('') }}"
pgbouncer_auth_password: "{{ vault_pgbouncer_auth_password | default('') }}"
pgbackrest_s3_key: "{{ vault_pgbackrest_s3_key | default('') }}"
pgbackrest_s3_key_secret: "{{ vault_pgbackrest_s3_key_secret | default('') }}"
pgbackrest_cipher_pass: "{{ vault_pgbackrest_cipher_pass | default('') }}"
