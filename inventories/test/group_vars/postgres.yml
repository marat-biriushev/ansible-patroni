---
# Каталоги данных и WAL (монтирование — на стороне команды ОС)
postgresql_data_dir: /var/lib/pgsql/{{ pg_major_version }}/data
postgresql_wal_dir: /var/lib/pgsql/{{ pg_major_version }}/wal

# Сети приложений, которым разрешено подключение напрямую (минуя HAProxy)
patroni_pg_hba_app_networks: []
#  - 10.20.0.0/16

# Параметры PostgreSQL на узле (мержатся с дефолтами роли patroni)
patroni_postgresql_parameters: {}
#  work_mem: 16MB

# Параметры DCS, которые накладываются на дефолты при bootstrap и при --tags dcs_config
patroni_dcs_overrides: {}
#  postgresql:
#    parameters:
#      max_connections: 500
