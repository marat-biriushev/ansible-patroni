---
# cluster_node_ip (по умолчанию = ansible_host) — адрес, на котором сервисы
# слушают и которым узлы общаются между собой.
all:
  children:
    postgres:
      hosts:
        int-res-test-psql01:
          ansible_host: 172.31.56.71
        int-res-test-psql02:
          ansible_host: 172.31.56.72
        int-res-test-psql03:
          ansible_host: 172.31.56.73
    # etcd совмещён с узлами БД (etcd_colocated: true в group_vars/all/main.yml)
    etcd:
      hosts:
        int-res-test-psql01:
        int-res-test-psql02:
        int-res-test-psql03:
    haproxy:
      hosts:
        int-res-test-ha01:
          ansible_host: 172.31.56.74
        int-res-test-ha02:
          ansible_host: 172.31.56.75
