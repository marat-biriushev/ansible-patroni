---
- name: Read postgresql module state
  ansible.builtin.command:
    cmd: dnf -q module list --disabled postgresql
  register: pg_repos_module_state
  changed_when: false
  failed_when: false
  check_mode: false

- name: Disable postgresql module
  ansible.builtin.command:
    cmd: dnf -y -q module disable postgresql
  when: pg_repos_module_state.rc != 0 or 'postgresql' not in pg_repos_module_state.stdout
  changed_when: true
