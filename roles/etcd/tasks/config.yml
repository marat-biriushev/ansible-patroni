---
- name: Create etcd data directory
  ansible.builtin.file:
    path: "{{ etcd_data_dir }}"
    state: directory
    owner: "{{ etcd_user }}"
    group: "{{ etcd_group }}"
    mode: "0700"

- name: Deploy etcd configuration
  ansible.builtin.template:
    src: etcd.yml.j2
    dest: "{{ etcd_config_file }}"
    owner: root
    group: "{{ etcd_group }}"
    mode: "0640"
  notify: Restart etcd

- name: Deploy etcd systemd unit
  ansible.builtin.template:
    src: etcd.service.j2
    dest: /etc/systemd/system/etcd.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart etcd

- name: Install etcdctl environment for administrators
  ansible.builtin.template:
    src: etcdctl.sh.j2
    dest: /etc/profile.d/etcdctl.sh
    owner: root
    group: root
    mode: "0644"
