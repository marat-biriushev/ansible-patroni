---
- name: Gather service state
  ansible.builtin.service_facts:

- name: Remember whether etcd was already running
  ansible.builtin.set_fact:
    etcd_was_active: "{{ ansible_facts.services['etcd.service'].state | default('') == 'running' }}"

- name: Apply pending unit changes
  ansible.builtin.meta: flush_handlers

# Все узлы стартуют одновременно: etcd ждёт кворума до отправки sd_notify.
- name: Start and enable etcd
  ansible.builtin.systemd_service:
    name: etcd
    state: started
    enabled: true

# HTTP /health на клиентском порту не требует логина — работает и до, и после auth enable
- name: Wait for local etcd endpoint
  ansible.builtin.uri:
    url: "https://{{ etcd_listen_ip }}:{{ etcd_client_port }}/health"
    ca_path: "{{ etcd_pki_dir }}/ca.crt"
    status_code: [200]
  register: etcd_health
  until: etcd_health.status == 200
  retries: "{{ etcd_wait_retries }}"
  delay: "{{ etcd_wait_delay }}"
  when: not ansible_check_mode
